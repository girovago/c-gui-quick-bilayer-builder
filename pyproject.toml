[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cgui-studio"
version = "0.1.0"
description = "Batch, reproducible layer over the CHARMM-GUI REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Giorgio Veneruso", email = "giorgi.veneruso@studenti.unina.it" }]
dependencies = [
  "fastapi>=0.162.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cgui = "cgui_studio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cgui_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: test che richiede rete reale e gmx (skip automatico se mancanti).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
