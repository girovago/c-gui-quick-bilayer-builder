name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - run: uv run ruff check .

      - run: uv run pytest -q
        env:
          # I test che richiedono gmx e lipid.rtp si saltano da soli se
          # mancanti (su CI non sono disponibili): skip leggibile, non fallimento.
          CGUI_MOCK: "1"
