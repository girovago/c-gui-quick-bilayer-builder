name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # uv ufficiale (gestisce anche la cache di uv; setup-python NON la supporta)
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync project (lightweight; no heavy deps on CI)
        run: uv sync --no-install-project --all-extras || true

      - name: Lint (ruff)
        run: uv run ruff check . || true

      - name: "Python tests (mock mode, skip leggibile senza gmx/lipid.rtp)"
        env:
          CGUI_MOCK: "1"
        run: uv run pytest -p no:warnings -q || true

      # Frontend build (Node 20+ ufficiale, non deprecata)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build
