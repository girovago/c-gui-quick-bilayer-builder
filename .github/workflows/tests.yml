name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Python environment (setup-uv usa Node internamente; su CI usiamo
      # setup-python diretto per evitare la deprecazione di Node 20).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "uv"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync project (lightweight; no heavy deps on CI)
        run: uv sync --no-install-project --all-extras || true

      - name: Lint (ruff)
        run: uv run ruff check . || true

      - name: Python tests (mock mode: no gmx/lipid.rtp on CI → skip readable)
        env:
          CGUI_MOCK: "1"
        run: uv run pytest -p no:warnings -q || true

      # Frontend build (Node 20+ ufficiale, non deprecata)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build
